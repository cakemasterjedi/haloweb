[platformio]
; Upload / Build only touch the emblem firmware. Without this, PlatformIO
; flashes every environment in turn and the hardware test (last) wins.
default_envs = esp32-s3-display

[env:esp32-s3-display]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB

; Quad flash + octal PSRAM (Waveshare's demo uses CONFIG_SPIRAM_MODE_OCT).
; With qio_qspi the log shows "PSRAM ID read error" and the display can't start.
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

extra_scripts = pre:tools/embed_web.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0  ; USB-C goes through a CH343 USB-UART chip
    -O2
    -DCORE_DEBUG_LEVEL=0  ; hide the core's noisy "handler not found"/"file does not exist" lines
    ; -DLCD_BL_PIN=-1  ; uncomment if your board has no backlight GPIO (dims in software)

lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
    bitbank2/JPEGDEC @ 1.8.2

; Hardware check without the display (see src/diag.cpp). Same flash / PSRAM
; settings as the emblem, so its PSRAM line shows what the emblem will get.
; Only built when asked for explicitly:  pio run -e diag -t upload
[env:diag]
extends = env:esp32-s3-display
extra_scripts =
build_flags =
    -DEMBLEM_DIAG
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
