[env:esp32-s3-display]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB

; This board has external quad (QSPI) PSRAM. "qio_opi" (octal) stops it booting.
board_build.arduino.memory_type = qio_qspi
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

extra_scripts = pre:tools/embed_web.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    ; -DLCD_BL_PIN=-1  ; uncomment if your board has no backlight GPIO (dims in software)

lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
    bitbank2/JPEGDEC @ 1.8.2

; Hardware check without the display (see src/diag.cpp):
;   pio run -e diag -t upload
[env:diag]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DEMBLEM_DIAG
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
